<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据要素贡献值分配 Demo</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>

<header class="page-header">
  <h1>数据要素贡献值分配 Demo</h1>
  <p class="subtitle">一次劳动，N 次增值 - 工业买断 vs AI 持续分润</p>
</header>

<main class="main-grid">

  <!-- ========== left: input ========== -->
  <aside class="panel panel-input" id="inputPanel">
    <h2>参数设置</h2>

    <fieldset class="param-group">
      <legend>全局参数</legend>
      <div class="form-row">
        <label>稀缺性衰减系数 k <span class="hint">N 越大 S 越小</span></label>
        <input type="number" id="gk" value="0.01" step="0.001" min="0">
      </div>
      <div class="form-row">
        <label>单次调用利润</label>
        <input type="number" id="gProfit" value="20000" step="100" min="0">
      </div>
      <div class="form-row">
        <label>公共服务比例 <span class="hint">税收 + 基础设施</span></label>
        <input type="number" id="gShare" value="0.30" step="0.01" min="0" max="1">
      </div>
      <div class="form-row">
        <label>收入上限倍数 <span class="hint">超额入公共池</span></label>
        <input type="number" id="gCapMul" value="300" step="10" min="1">
      </div>
      <div class="form-row">
        <label>传统计件单价</label>
        <input type="number" id="gTradRate" value="5" step="1" min="0">
      </div>
      <div class="form-row form-row-2col">
        <div>
          <label>时间轴轮数</label>
          <input type="number" id="gTimeline" value="5" step="1" min="1" max="200">
        </div>
        <div>
          <label>长期推演轮数</label>
          <input type="number" id="gProjection" value="50" step="1" min="1" max="500">
        </div>
      </div>
    </fieldset>

    <fieldset class="param-group">
      <legend>贡献者列表</legend>
      <div id="contributorList"></div>
      <button type="button" class="btn btn-sm btn-outline" id="btnAddContributor">+ 添加贡献者</button>
    </fieldset>

    <div class="action-buttons">
      <button type="button" class="btn btn-primary" id="btnCalculate">计算贡献值</button>
      <button type="button" class="btn btn-accent" id="btnSimulate">模拟持续调用</button>
    </div>
  </aside>

  <!-- ========== right: results ========== -->
  <section class="panel panel-visual">

    <div class="compare-cards" id="compareCards">
      <div class="card card-industry">
        <div class="card-label">工业时代<br>一次性买断合计</div>
        <div class="card-value" id="cardIndustry">-</div>
      </div>
      <div class="card card-ai">
        <div class="card-label">AI 时代<br>劳动者持续收入合计</div>
        <div class="card-value" id="cardAI">-</div>
      </div>
      <div class="card card-pool">
        <div class="card-label">公共基金池<br>超额回流</div>
        <div class="card-value" id="cardPool">-</div>
      </div>
    </div>

    <div class="highlight-quote" id="highlightQuote" style="display:none">
      <span id="quoteText"></span>
    </div>

    <div class="section" id="detailSection" style="display:none">
      <h2>贡献值计算详情</h2>
      <div class="table-wrap">
        <table id="detailTable">
          <thead>
            <tr>
              <th>贡献者</th><th>工时</th><th>准确率</th><th>复杂度</th><th>存量N</th>
              <th>稀缺性S</th><th>贡献值</th><th>占比</th><th>单次应分</th><th>上限</th><th>传统收入</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="section" id="chartSection" style="display:none">
      <h2>分配可视化</h2>
      <div class="chart-tabs">
        <button class="chart-tab active" data-view="contribution">贡献值对比</button>
        <button class="chart-tab" data-view="profit">单次分润对比</button>
      </div>
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div class="section" id="timelineSection" style="display:none">
      <h2>多轮持续分润时间轴</h2>
      <div class="timeline" id="timelineBar"></div>
      <div class="timeline-detail" id="timelineDetail" style="display:none">
        <h3>第 <span id="tlCallIdx">-</span> 轮明细</h3>
        <table class="table-sm">
          <thead>
            <tr><th>贡献者</th><th>应分</th><th>实际入账</th><th>入公共池</th></tr>
          </thead>
          <tbody id="tlDetailBody"></tbody>
        </table>
      </div>
    </div>

  </section>
</main>

<footer class="page-footer">
  <p>本页为机制演示 Demo，非完整生产系统（无链、无登录、无持久化）</p>
</footer>

<template id="tmplContributor">
  <div class="contributor-row">
    <input type="text" class="ctr-name" placeholder="姓名" required>
    <input type="number" class="ctr-hours" placeholder="工时" min="0.1" step="0.5" required>
    <input type="number" class="ctr-accuracy" placeholder="准确率" min="0.01" max="1" step="0.01" required>
    <input type="number" class="ctr-complexity" placeholder="复杂度" min="1" max="5" step="1" required>
    <input type="number" class="ctr-pool" placeholder="存量N" min="0" step="1" required>
    <button type="button" class="btn-remove" title="移除">x</button>
  </div>
</template>

</body>
</html>
